<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まとめるくん</title>
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <!-- サイドパネルやウィンドウの枠に「まとめるくん」の名前は出るので、
       こちらはタブと操作ボタンの1段だけにする（名前の二重表示を避ける） -->
  <header class="top-bar">
    <nav class="tab-bar" id="tabBar" data-i18n-aria="tabAriaLabel"></nav>
    <div class="top-actions">
      <!-- バージョンはJSがmanifestから入れる（手書きだとズレる） -->
      <span class="version-badge" id="versionBadge"></span>
      <button id="btnPopout" class="btn-ghost" data-i18n-title="btnPopoutTip" hidden>⧉</button>
      <button id="btnDock" class="btn-ghost" data-i18n-title="btnDockTip" hidden>⇥</button>
      <button id="btnSettings" class="btn-ghost" data-i18n-title="btnSettingsTip">⚙</button>
    </div>
  </header>

  <!-- 設定（通常は閉じている） -->
  <section id="settingsView" class="settings" hidden>
    <h2 class="settings-heading" data-i18n="settingsHeading"></h2>
    <p class="settings-note" data-i18n="settingsNote"></p>
    <div id="settingsFields"></div>
    <div class="settings-buttons">
      <button id="btnSettingsSave" class="btn-primary" data-i18n="btnSave"></button>
      <button id="btnSettingsClose" class="btn-secondary" data-i18n="btnClose"></button>
    </div>
  </section>

  <!-- 各拡張の表示エリア（iframeはJSが差し込む） -->
  <main id="frames" class="frames"></main>

  <div id="toast" class="toast" hidden></div>

  <script src="hub.js"></script>
</body>
</html>
